name: Harness Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/torchtalk/harness.py"
      - "src/torchtalk/integration_manifest.py"
      - "src/torchtalk/manifests/**"
      - "src/torchtalk/analysis/patterns.py"
      - "src/torchtalk/analysis/extractors.py"
      - "src/torchtalk/analysis/binding_detector.py"
      - "src/torchtalk/indexer.py"
      - "scripts/harness_smoke.py"
      - "tests/integration/**"
      - ".github/workflows/harness-smoke.yml"

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.harnesses }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: List harnesses with expected_minimums
        id: list
        run: echo "harnesses=$(python3 scripts/harness_smoke.py --list)" >> "$GITHUB_OUTPUT"

  harness-smoke:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        harness: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install torchtalk
        run: pip install -e ".[dev]"

      - name: Run harness smoke test
        run: python scripts/harness_smoke.py --harness ${{ matrix.harness }} --clone
