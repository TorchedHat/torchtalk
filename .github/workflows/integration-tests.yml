name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/torchtalk/analysis/**"
      - "src/torchtalk/integration_manifest.py"
      - "src/torchtalk/manifests/**"
      - "tests/test_binding_detector_pytorch.py"
      - "tests/integration/**"
      - ".github/workflows/integration-tests.yml"

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: List targets from tests/integration/*.yml
        id: list
        run: |
          python3 << 'SCRIPT'
          import json, os
          from torchtalk.integration_manifest import integration_manifest_paths

          targets = [p.stem for p in integration_manifest_paths("tests/integration")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"targets={json.dumps(targets)}\n")
          SCRIPT

  integration:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout torchtalk
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install torchtalk
        run: pip install -e ".[dev]"

      - name: Read manifest
        id: manifest
        run: |
          python3 << 'SCRIPT'
          import os
          from torchtalk.integration_manifest import load_integration_manifest

          m = load_integration_manifest(
              "tests/integration/${{ matrix.target }}.yml"
          )

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"repo={m['repo']}\n")
              f.write(f"ref={m['ref']}\n")
              f.write(f"env_var={m['env_var']}\n")
              f.write("sparse_paths<<EOF\n")
              for p in m["sparse_paths"]:
                  f.write(f"{p}\n")
              f.write("EOF\n")
          SCRIPT

      - name: Sparse checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.manifest.outputs.repo }}
          ref: ${{ steps.manifest.outputs.ref }}
          sparse-checkout: ${{ steps.manifest.outputs.sparse_paths }}
          filter: blob:none
          path: _target

      - name: Set source env var
        run: echo "${{ steps.manifest.outputs.env_var }}=${{ github.workspace }}/_target" >> $GITHUB_ENV

      - name: Run integration tests
        run: python -m pytest tests/test_binding_detector_pytorch.py -v
